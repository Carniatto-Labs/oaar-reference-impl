extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/redact:
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{12,}", "***REDACTED***")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***REDACTED***")
      - context: spanevent
        statements:
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{12,}", "***REDACTED***")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***REDACTED***")
    log_statements:
      - context: log
        statements:
          - replace_all_patterns(attributes, "value", "sk-[A-Za-z0-9_-]{12,}", "***REDACTED***")
          - replace_all_patterns(attributes, "value", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***REDACTED***")
          - replace_pattern(body, "sk-[A-Za-z0-9_-]{12,}", "***REDACTED***") where body != nil
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "***REDACTED***") where body != nil
  batch:
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlphttp/loki]
