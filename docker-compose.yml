name: oaar-impl

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: oaar
      POSTGRES_PASSWORD: oaar
      POSTGRES_DB: oaar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oaar -d oaar"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: collector_config
        target: /etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo.yaml
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_LOG_LEVEL: warn
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/provider.yml
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["uvicorn", "oaar_impl.mcp_server:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  product-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["uvicorn", "oaar_impl.product_api:app", "--host", "0.0.0.0", "--port", "8082"]
    environment:
      OAAR_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: product-api
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8082/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["uvicorn", "oaar_impl.payment_api:app", "--host", "0.0.0.0", "--port", "8083"]
    environment:
      OAAR_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: payment-api
    ports:
      - "18083:8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8083/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  chat-panel:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["uvicorn", "oaar_impl.chat_panel:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      OAAR_POSTGRES_DSN: postgresql://oaar:oaar@postgres:5432/oaar
      OAAR_OTLP_ENDPOINT: http://otel-collector:4318
      OAAR_MODEL: ${OAAR_MODEL:-gemma4:12b-mlx}
      OAAR_OLLAMA_BASE_URL: ${OAAR_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      product-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    command: ["python", "-m", "oaar_impl.preflight"]
    environment:
      OAAR_POSTGRES_DSN: postgresql://oaar:oaar@postgres:5432/oaar
      OAAR_OTLP_ENDPOINT: http://otel-collector:4318
    profiles: ["preflight"]
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
      mcp-server:
        condition: service_healthy
      product-api:
        condition: service_healthy
      payment-api:
        condition: service_healthy
      grafana:
        condition: service_started

volumes:
  pgdata:

configs:
  collector_config:
    file: ./collector/config.yaml
  tempo_config:
    file: ./tempo/tempo.yaml
  prometheus_config:
    file: ./prometheus/prometheus.yml
  grafana_datasources:
    file: ./grafana/provisioning/datasources/datasources.yml
  grafana_dashboards_provider:
    file: ./grafana/provisioning/dashboards/provider.yml
